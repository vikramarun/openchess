# Fly.io config for the OpenChess game server. First time:
#
#   fly launch --no-deploy --copy-config --ha=false --name openchess
#   fly postgres create --name openchess-db && fly postgres attach openchess-db
#   fly secrets set RPC_URL=... ESCROW_ADDR=0x... ORACLE_KEY=0x... HOUSE_WALLET=0x...
#
# Then deploy ONLY with the wrapper (it deploys --ha=false, pins one machine,
# makes sure it's started, and gates on /health, /ready and /config):
#
#   ./scripts/deploy-server.sh
#
# Full runbook and every env var: docs/operations.md.
#
# IMPORTANT: this is a single-node, stateful server (live games, lobby, rooms,
# launch tokens, and SIWE sessions are all in-process memory). It MUST run
# exactly ONE machine. Fly defaults to a 2-machine HA pair, which silently
# breaks everything (each request hits a different machine's memory: offers
# vanish, games won't start, sign-in doesn't stick). So:
# never run a bare `fly deploy` (it re-adds the HA machine). True HA needs the
# shared-store + room-affinity work in docs/multi-node.md; until then, one
# machine only.

app = "openchess"
primary_region = "iad"

# Time the server gets after SIGTERM before Fly kills it. MUST exceed
# `DRAIN_BUDGET` in crates/server/src/main.rs (10s), because that drain is what
# ends live games and enqueues their refunds — a stake it doesn't reach stays
# locked until the escrow's 24h claimTimeout. Fly's default is 5s, which is
# shorter than the drain and would cut it off partway through.
kill_timeout = "20s"

[build]
  dockerfile = "Dockerfile"

[env]
  BIND = "0.0.0.0:8080"
  # The canonical frontend host. SIWE_DOMAIN is host-only (must equal the browser
  # URL exactly); WEB_ORIGIN is the full origin (CORS). The apex is the only
  # production origin (www.openchess.ai does not resolve).
  SIWE_DOMAIN = "openchess.ai"
  WEB_ORIGIN = "https://openchess.ai"
  # Chain used for SIWE + escrow. Only matters once you enable wagering — flip to
  # "84532" when you wager on Base Sepolia. (8453 = Base mainnet.)
  SIWE_CHAIN_ID = "8453"
  # Refuse to boot unless DATABASE_URL + RPC_URL + ESCROW_ADDR + ORACLE_KEY and
  # SIWE_DOMAIN/WEB_ORIGIN are all set (see main.rs REQUIRE_ONCHAIN). Enabled
  # because the failure it prevents already happened: the server ran for a
  # while with no DATABASE_URL, which meant no persistence and — because the
  # settlement outbox workers only spawn when a DB exists — no durable
  # settlement, while still accepting real wagers. Nothing surfaced it, since
  # /health and /ready both reported OK.
  #
  # Turn this OFF only for a deliberately casual-only node (no wagering).
  REQUIRE_ONCHAIN = "1"

# Secrets (NOT in this file — set via `fly secrets set` / `fly postgres attach`):
#   DATABASE_URL          (from `fly postgres attach`)
#   RPC_URL               (Base RPC endpoint)
#   ESCROW_ADDR           (deployed ChessEscrow address)
#   ORACLE_KEY            (oracle signer key; a plaintext hot key today, with no
#                          KMS support yet — see docs/operations.md)
#   HOUSE_WALLET          (the house bot's address; quick play needs it)
#   ALERT_WEBHOOK_URL     (optional: money-path failure alerts)
#   SETTLE_CONFIRMATIONS  (optional: blocks before a write counts, default 1)

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1
  # WebSockets ride over the same HTTP service (Fly proxies WS transparently).

  [[http_service.checks]]
    method = "get"
    path = "/ready"
    interval = "15s"
    timeout = "3s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
