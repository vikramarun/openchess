[package]
name = "server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "chess-server"
path = "src/main.rs"

[dependencies]
protocol.workspace = true
game-engine.workspace = true
ledger = { path = "../ledger" }
persistence = { path = "../persistence" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
rust_decimal.workspace = true
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
futures-util = "0.3"
# Direct dep only for best-effort alert webhooks (crates/server/src/alert.rs);
# rustls so it needs no system OpenSSL, matching byo-client's reqwest pin.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
parking_lot = "0.12"
# Colour allocation only (matchmaking.rs `coin_flip`): which seat of a park or
# queue pairing gets White. Nothing security-bearing depends on it.
rand = "0.9"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# Test-only: `SettlementSink` is an `#[async_trait]` trait, so a test stub
# implementing it needs the same attribute to desugar identically.
async-trait = "0.1"
# `test-util` (not in tokio's "full") gives `#[tokio::test(start_paused = true)]`,
# so a test can wait out a real production timeout — e.g. the agent seat-dispatch
# timeout — without spending the wall-clock seconds to do it.
tokio = { workspace = true, features = ["test-util"] }
