# Fly config for the OpenChess **house bot** — a separate app from the game
# server (fly.toml). It keeps the park populated so the lobby is never empty.
#
#   fly apps create openchess-housebot --org personal
#   fly secrets set --stage -a openchess-housebot OPENCHESS_WALLET_KEY=0x...
#   fly deploy --config fly.housebot.toml --ha=false
#   fly scale count 1 -a openchess-housebot
#
# `--stage` is load-bearing on the FIRST secret. Without it `fly secrets set`
# tries to push the value straight to running machines, and this app has none
# yet, so it fails with "could not create a fly.toml from any machines / No
# machines configured for this app". Staging stores the secret and lets the
# first `fly deploy` create the machine with it already in the environment —
# which is the order you want anyway, since house-bot.sh exits immediately
# without OPENCHESS_WALLET_KEY and would otherwise crash-loop the machine.
# (`fly secrets deploy` hits the same no-machines wall; just deploy.)
#
# Run exactly ONE machine. The script already runs one autopilot per time
# control; a second machine would post a duplicate challenge per tile under the
# same wallet, so the lobby fills with house-vs-house offers.
#
# The wallet must hold NO funds. House games are casual (no stake) — the key
# only signs SIWE to give the bot a stable identity.

app = "openchess-housebot"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.housebot"

[env]
  SERVER = "https://openchess.fly.dev"
  # Debian installs the engine here on both bookworm and trixie; the image is
  # pinned to trixie so this is Stockfish 17 rather than bookworm's 15.1.
  ENGINE = "/usr/games/stockfish"
  NAME = "House Bot"
  # Stockfish "Skill Level" 0..20 — 20 is full strength. The house bot plays
  # its best; it is an opponent, not a tutorial. (Below 20 Stockfish doesn't
  # think less, it searches just as long and then plays a deliberately worse
  # move from the top few — weakness that reads as random blunders. If a
  # beatable tier is ever wanted, UCI_LimitStrength + UCI_Elo is the knob that
  # actually targets a rating.)
  SKILL = "20"
  # Matches the lobby's 1+0 / 3+0 / 5+0 / 10+0 tiles.
  TCS = "60:0 180:0 300:0 600:0"

# No [http_service]: this app listens on nothing, it dials out. That also means
# no health check — Fly restarts the machine if the process exits, and the
# script's own backoff loop handles a single autopilot dying.
[[vm]]
  # Two shared vCPUs, not one: four autopilots idle at ~0% while waiting for an
  # acceptance, but a 1+0 bullet game needs real CPU the moment one lands, and a
  # house bot that flags on time is worse than no house bot at all.
  size = "shared-cpu-2x"
  memory = "1gb"
