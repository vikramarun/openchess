# Fly config for the OpenChess **house bot** — a separate app from the game
# server (fly.toml). It keeps the park populated so the lobby is never empty.
#
#   fly apps create openchess-housebot --org personal
#   fly secrets set --stage -a openchess-housebot OPENCHESS_WALLET_KEY=0x...
#   fly deploy --config fly.housebot.toml --ha=false
#   fly scale count 1 -a openchess-housebot
#
# `--stage` is load-bearing on the FIRST secret. Without it `fly secrets set`
# tries to push the value straight to running machines, and this app has none
# yet, so it fails with "could not create a fly.toml from any machines / No
# machines configured for this app". Staging stores the secret and lets the
# first `fly deploy` create the machine with it already in the environment —
# which is the order you want anyway, since house-bot.sh exits immediately
# without OPENCHESS_WALLET_KEY and would otherwise crash-loop the machine.
# (`fly secrets deploy` hits the same no-machines wall; just deploy.)
#
# Run exactly ONE machine. Concurrency belongs to SEATS (autopilots per time
# control), which the script owns and can size deliberately; a second machine
# would instead double every tile behind the app's back and put the wallet's
# standing offers over RL_MAX_OPEN_OFFERS, where the excess seats 429 silently.
#
# The wallet must hold NO funds. House games are casual (no stake) — the key
# only signs SIWE to give the bot a stable identity.

app = "openchess-housebot"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.housebot"

[env]
  SERVER = "https://openchess.fly.dev"
  # Debian installs the engine here on both bookworm and trixie; the image is
  # pinned to trixie so this is Stockfish 17 rather than bookworm's 15.1.
  ENGINE = "/usr/games/stockfish"
  NAME = "House Bot"
  # Stockfish "Skill Level" 0..20 — 20 is full strength. The house bot plays
  # its best; it is an opponent, not a tutorial. (Below 20 Stockfish doesn't
  # think less, it searches just as long and then plays a deliberately worse
  # move from the top few — weakness that reads as random blunders. If a
  # beatable tier is ever wanted, UCI_LimitStrength + UCI_Elo is the knob that
  # actually targets a rating.)
  SKILL = "20"
  # Matches the lobby's 1+0 / 3+0 / 5+0 / 10+0 tiles.
  TCS = "60:0 180:0 300:0 600:0"
  # Concurrent house games per time control. At 1, the first visitor to accept
  # a tile takes the only seat at it and that tile disappears from the lobby
  # until their game ends — the house looked broken rather than busy. 4 TCs × 2
  # = 8 standing offers under one wallet; RL_MAX_OPEN_OFFERS (16) leaves room,
  # so raising SEATS here is safe up to 4 without touching the server.
  SEATS = "2"

# No [http_service]: this app listens on nothing, it dials out. That also means
# no health check — Fly restarts the machine if the process exits, and the
# script's own backoff loop handles a single autopilot dying.
[[vm]]
  # Sized for CONCURRENT GAMES, not autopilots. An idle autopilot costs ~0% (it
  # is a poll loop — the engine is launched per game, and the one probe at
  # startup quits straight away), but every game in progress is a Stockfish
  # thread wanting a core, and a house bot that flags on time is worse than no
  # house bot at all.
  #
  # Four shared vCPUs because TCS×SEATS = 8 seats now stand open, so the ceiling
  # doubled when SEATS did. This does not cover the absolute worst case (8
  # simultaneous games would still oversubscribe) — it covers the realistic
  # peak with headroom, and the two existing per-game CPU bounds do the rest:
  # --max-move-ms caps each search and the opening book makes the first ~16
  # plies cost no search at all. Raise this BEFORE raising SEATS again.
  #
  # 2gb, above shared-cpu-4x's 1gb default, because memory IS a constraint here
  # — it stopped being free when SEATS went to 2. A Stockfish 17 process is
  # ~150MB resident (the NNUE net, not the 16MB hash), so the eight-engine peak
  # wants ~1.2GB and the kernel OOM-killed five of them on the 1gb machine.
  #
  # Eight at once happens in two places. Every boot: each autopilot probes the
  # engine for its name and UCI options before posting (connect.rs), so all
  # TCS×SEATS probes land together — the probe quits immediately, which is why
  # an idle bot then sits near zero, but the spike is real and it cost four
  # autopilots a crash-and-backoff cycle before the staggered restarts fit.
  # And at peak: eight simultaneous games hold eight engines for real.
  #
  # So this scales with TCS×SEATS, same as the vCPUs above. Raise it before
  # raising SEATS again — an OOM kill surfaces as "engine closed its output
  # stream", which reads like an engine bug rather than a sizing one.
  size = "shared-cpu-4x"
  memory = "2gb"
