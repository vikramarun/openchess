name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chess
          POSTGRES_PASSWORD: chess
          POSTGRES_DB: chess
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Postgres for the persistence test (otherwise it no-ops).
      DATABASE_URL: postgres://chess:chess@localhost:5432/chess
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      # Contracts FIRST — the `ledger` crate compiles against contracts/out/.
      - name: Build + test contracts
        run: cd contracts && forge build && forge test -vv

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # Lints are blocking: the workspace was brought to zero warnings and one
      # bulk `cargo fmt` (see .git-blame-ignore-revs), and drift-from-zero is
      # the cheapest moment to catch a real bug a lint would have named.
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: rustfmt --check
        run: cargo fmt --check

      - name: Cargo test (workspace)
        run: cargo test --workspace

      # assets/house-book.bin is the one file review can't read. Regenerating
      # it and diffing proves the committed blob is exactly what the checked-in
      # repertoire produces — otherwise "generated, not downloaded" is a claim
      # reviewers have to take on faith. The generator is deterministic, so an
      # unchanged repertoire gives an empty diff.
      - name: Opening book matches its source repertoire
        run: |
          cargo run -p book-gen -- assets/house-book.bin
          git diff --exit-code --stat assets/house-book.bin \
            || { echo "::error::assets/house-book.bin is stale — re-run 'cargo run -p book-gen -- assets/house-book.bin' and commit the result"; exit 1; }

      - name: Web build + tests
        run: |
          corepack enable
          # Frozen, like Vercel's production install: CI green must prove the
          # LOCKED tree builds, not whatever a caret dep resolved to today.
          cd apps/web && pnpm install --frozen-lockfile
          # These suites existed but nothing ran them, so a regression in the
          # polyglot keys, the eval bar, or session handling would only have
          # shown up in a browser. Before the build: they are seconds, and a
          # failure here is a clearer signal than a build error.
          pnpm test:book
          pnpm test:books
          pnpm test:time
          pnpm test:candidates
          # The seat engine's failure paths gate whether the lobby will stake at
          # all: a cached rejection there stopped the player posting for the rest
          # of the session while telling them to try again.
          pnpm test:seatengine
          pnpm test:eval
          pnpm test:auth
          # Guards the decline path: a seat that closes its socket instead of
          # waiting out the void turns a refund into a forfeit of the stake.
          pnpm test:seat
          # Added with the ply state machine (#32) but never listed here, so it
          # had never run. Same trap as the note above; keep this list in step
          # with package.json.
          pnpm test:nav
          # Guards the lobby's offer grouping and the join walk over a group's
          # seats. A merge key that is too loose collapses two posters into one
          # row and seats a joiner at the wrong board; the walk is where a
          # lost race is told apart from a real failure.
          pnpm test:offers
          # Guards the two halves of the castling-notation trap: a king-takes-rook
          # move in the shipped book, or one reaching an engine, silently
          # truncates the engine's position, and every move it returns after
          # that is illegal, which the seat used to resign over.
          pnpm test:openings
          pnpm test:move
          # One bestmove answers one `go`. Broadcasting it let an abandoned
          # search answer for a live one, with a move for the wrong position.
          pnpm test:engine
          # The board theme is applied twice: an inline script that runs before
          # first paint, and applyBoardPrefs after React mounts. If the two ever
          # compute different CSS variables the board visibly changes on load,
          # which a screenshot of a settled page would never catch. This runs
          # the script in a sandbox and diffs it against the React path.
          pnpm test:prefs
          # The mark exists twice — lib/brand.ts and app/icon.svg, because Next's
          # icon convention cannot import from TypeScript — and nothing at
          # runtime compares them, so the favicon can silently stop matching the
          # header. This also pins the OG cards to drawing the mark inline:
          # resvg in a production bundle drops a nested SVG image and still
          # returns 200, which the dev server never reproduces.
          pnpm test:brand
          # globals.css named "Noto Sans" for the life of the project while
          # nothing loaded it, so everyone silently got the system font. The
          # replacement has the same failure shape — globals.css asks for
          # var(--font-sans), layout.tsx defines it, and if either side goes
          # away the CSS still parses and still falls back forever.
          pnpm test:font
          # What a shared game link says, in a browser tab and in an unfurl.
          # Also pins the two revalidate literals together: if the title and the
          # OG image expire on different schedules, a game crawled while live
          # keeps a scoreless title beside a card that shows the result.
          pnpm test:gamemeta
          # The server's 256 KiB body cap is only workable because the browser
          # crops and re-encodes to a 256px JPEG first. If that stopped
          # happening, every phone photo would start arriving at full size and
          # uploads would 413 — for users only, never in a test.
          pnpm test:avatar
          # Ranked vs casual on the profile. A game is ranked when money was on
          # it — including a buy-in tournament game, which carries no stake of
          # its own, so classifying by stake quietly files paid games as casual.
          # The same helpers have to degrade to today's single record against a
          # server that predates the split, which is the normal deploy order.
          pnpm test:profile
          # A static site header puts the top nav ~640px above the screen by the
          # time a finished game is readable, so the only clickable link left is
          # the one in the board sidebar — and a header that outranks
          # .modal-overlay turns the pre-game stake confirmation into a dialog
          # you can click behind. Both are one-line CSS regressions that nothing
          # else here would see.
          pnpm test:layout
          # Below 720px the bottom tab bar is the ONLY navigation (the header's
          # .nav is display:none there), and "/player/0xabc".startsWith("/play")
          # is true — so a bare prefix match lights "Engine" on every profile.
          pnpm test:tabs
          # The homepage reel is a scripted replay with no engine behind it. If
          # its move list stops ending in mate, or the component ever reaches for
          # lib/engine, the landing page silently costs every cold mobile visit a
          # 7 MB wasm download.
          pnpm test:demo
          pnpm build
