name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chess
          POSTGRES_PASSWORD: chess
          POSTGRES_DB: chess
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Postgres for the persistence test (otherwise it no-ops).
      DATABASE_URL: postgres://chess:chess@localhost:5432/chess
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      # Contracts FIRST — the `ledger` crate compiles against contracts/out/.
      - name: Build + test contracts
        run: cd contracts && forge build && forge test -vv

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Cargo test (workspace)
        run: cargo test --workspace

      # assets/house-book.bin is the one file review can't read. Regenerating
      # it and diffing proves the committed blob is exactly what the checked-in
      # repertoire produces — otherwise "generated, not downloaded" is a claim
      # reviewers have to take on faith. The generator is deterministic, so an
      # unchanged repertoire gives an empty diff.
      - name: Opening book matches its source repertoire
        run: |
          cargo run -p book-gen -- assets/house-book.bin
          git diff --exit-code --stat assets/house-book.bin \
            || { echo "::error::assets/house-book.bin is stale — re-run 'cargo run -p book-gen -- assets/house-book.bin' and commit the result"; exit 1; }

      - name: Web build + tests
        run: |
          corepack enable
          cd apps/web && pnpm install --frozen-lockfile=false
          # These suites existed but nothing ran them, so a regression in the
          # polyglot keys, the eval bar, or session handling would only have
          # shown up in a browser. Before the build: they are seconds, and a
          # failure here is a clearer signal than a build error.
          pnpm test:book
          pnpm test:eval
          pnpm test:auth
          # Guards the decline path: a seat that closes its socket instead of
          # waiting out the void turns a refund into a forfeit of the stake.
          pnpm test:seat
          # Guards the two halves of the castling-notation trap: a king-takes-rook
          # move in the shipped book, or one reaching an engine, silently
          # truncates its position and every move it returns after that is
          # illegal — which the seat used to resign over.
          pnpm test:openings
          pnpm test:move
          # One bestmove answers one `go`. Broadcasting it let an abandoned
          # search answer for a live one, with a move for the wrong position.
          pnpm test:engine
          pnpm build
