name: Feature request
description: Suggest an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
  - type: markdown
    attributes:
      value: |
        One rule worth knowing before suggesting it: nothing in OpenChess offers to make an engine weaker (no skill levels or Elo limiters). See CLAUDE.md for the reasoning.
