# pnpm 10.16+/11 treat un-allowlisted dependency build scripts as a hard install
# error (ERR_PNPM_IGNORED_BUILDS), which fails CI during `pnpm install` before the
# build even runs. Allow the handful of native/build-script deps this app pulls in.
# pnpm 11 reads `allowBuilds` here (not the package.json "pnpm" field, which it
# ignores); see https://pnpm.io/settings.
allowBuilds:
  bufferutil: true
  esbuild: true
  keccak: true
  secp256k1: true
  utf-8-validate: true
  # Both arrived with the Dynamic SDK and both are declined on purpose — an
  # entry here is a decision, not a permission, and pnpm 11 errors on any
  # dependency whose build script is neither allowed nor refused.
  #
  # `sharp` is Node-side image processing (Dynamic pulls it in through its icon
  # tooling) and this app never optimizes an image on the server: next/image
  # callers pass `unoptimized` and there are no remotePatterns. `bigint-buffer`
  # is a native speedup for Solana bigint maths, and there is no Solana here.
  # Every build in this repo has run with both unbuilt, so `false` costs nothing
  # and skips compiling two native addons on every CI run.
  bigint-buffer: false
  sharp: false
